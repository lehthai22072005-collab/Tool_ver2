model_name: vinai/phobert-base
max_length: 256
stride: 64
learning_rate: 0.00003
batch_size: 16
gradient_accumulation_steps: 1
epochs: 5
fp16: true
weight_decay: 0.01
warmup_ratio: 0.1
early_stopping_patience: 5
seed: 42
confidence_threshold: 0.5
fuzzy_match_threshold: 92
train_ratio: 0.60
validation_ratio: 0.20
test_ratio: 0.20
word_segmentation: none
normalization_version: "1.0"
duplicate_occurrence_policy: first_for_document_attributes
allow_nested: false
negative_chunk_ratio: 0.25
validation_negative_chunk_ratio: 1.0
entity_class_weight: 50.0
save_total_limit: 1
save_last: false
save_strategy: epoch
eval_strategy: epoch
